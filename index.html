<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8EE">
  <meta name="robots" content="noindex">
  <title>ずぼら16タイプ診断所</title>
  <link rel="preload" href="fonts/ZenMaru-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ZenMaru-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">

    <section id="start" class="screen" hidden>
      <div class="fall-layer" id="fall-layer" aria-hidden="true"></div>
      <div class="start-head">
        <img class="start-logo" id="start-logo" alt="ずぼらのメガネ" hidden>
        <p class="start-place">第77回駒場祭　5号館 517</p>
        <h1 class="start-title">ずぼら<br>16タイプ<br>診断所</h1>
      </div>
      <div class="sheet start-body">
        <p class="lead">あなたのずぼら、測ります。<br>全27問の質問に答えると、<br>ずぼら度と16タイプが判明。</p>
        <p class="note">所要時間は3分ほどです。<br>回答は匿名で、統計のために記録されます。</p>
        <p class="staff-flag" hidden>スタッフ入力モード（紙と同じ順番）</p>
        <button type="button" class="btn btn-main" id="btn-start">はじめる</button>
      </div>
    </section>

    <section id="quiz" class="screen" hidden>
      <header class="progress" aria-live="polite">
        <div class="progress-bar"><span class="progress-fill"></span></div>
        <p class="progress-text"><span id="progress-count">0</span> / 27</p>
      </header>
      <ol class="questions" id="questions"></ol>
      <div class="pager">
        <button type="button" class="btn btn-sub" id="btn-back">もどる</button>
        <button type="button" class="btn btn-main" id="btn-next">次へ</button>
      </div>
    </section>

    <section id="result" class="screen" hidden>
      <h2 class="visually-hidden">診断結果</h2>
      <div class="result-figure">
        <img id="result-img" alt="">
        <p class="result-wait" id="result-wait">集計しています</p>
      </div>
      <div class="result-actions">
        <button type="button" class="btn btn-main" id="btn-share">画像を保存・シェア</button>
        <p class="note">画像を長押ししても保存できます。</p>
        <p class="note small">※この偏差値は推定分布に基づく簡易的なものです。<br>本診断は学術的な心理検査ではなく、企画として楽しむものです。</p>
        <button type="button" class="btn btn-sub" id="btn-again">はじめからやり直す</button>
      </div>
    </section>

    <noscript><p class="sheet">このページを使うには JavaScript を有効にしてください。</p></noscript>
  </main>

  <template id="tpl-question">
    <li class="q">
      <p class="q-text"><span class="q-no"></span><span class="q-body"></span></p>
      <div class="scale" role="radiogroup">
        <!-- 左端「そう思う」=6 … 右端「そう思わない」=0 -->
      </div>
      <div class="scale-labels" aria-hidden="true"><span class="agree">そう思う</span><span class="disagree">そう思わない</span></div>
    </li>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
